;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Site Configuration File ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; Baked into the image so the Spanish locale survives every rebuild instead
; of having to be re-set by hand through direct file edits each time the
; /var/www/html volume gets recreated. See application/config/config.ini.changeme
; (shipped with Omeka core) for the full list of available settings.

[site]

; The Curatescape theme/plugin translation catalogs are named "es.mo" (not
; "es_ES.mo") to match Omeka core's own shipped catalog (application/languages
; has es.mo, not es_ES.mo) — using "es_ES" here would break core's Spanish UI.
locale.name = "es"
